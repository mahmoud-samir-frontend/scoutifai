<aside [class.collapsed]="collapsed"><div class="side-head"><app-brand-logo [light]="true"/><button type="button" class="collapse-button" (click)="toggle()" [attr.aria-label]="collapsed?'Expand menu':'Collapse menu'" [attr.aria-expanded]="!collapsed">{{collapsed?'›':'‹'}}</button></div><div class="role"><span>{{auth.currentUser.initials}}</span><div><b>{{auth.currentUser.name}}</b><small>{{auth.currentUser.role}}</small></div></div><nav><span class="section-label">SCOUTIFAI</span><a routerLink="/dashboard" routerLinkActive="active" title="Dashboard"><app-icon name="grid"/><span>Dashboard</span></a><a *ngFor="let item of entityMenu" [routerLink]="item.path" routerLinkActive="active" [title]="item.label"><app-icon [name]="item.icon"/><span>{{item.label}}</span></a><a *ngIf="canManageRoles" routerLink="/roles" routerLinkActive="active" title="Roles"><app-icon name="roles"/><span>Roles</span></a></nav><button type="button" class="signout" (click)="auth.logout()"><app-icon name="logout"/><span>Sign out</span></button></aside>
